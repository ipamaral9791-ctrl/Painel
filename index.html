<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Painel Gerencial</title>
<style>
:root{--bg:#F7F5EF;--fg:#0E1A2E;--mut:#6B7385;--line:#E3DFD2;--gold:#8D6A0E;--bad:#C93C20;--card:#fff;--btn:#0E1A2E;--btnfg:#F7F5EF;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E1A2E;--fg:#F4F1E9;--mut:#A7B1C4;--line:rgba(244,241,233,.16);--gold:#D7B04A;--bad:#FF7D5F;--card:#14223A;--btn:#D7B04A;--btnfg:#1a1303;color-scheme:dark}}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:15px/1.45 "Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;display:grid;place-items:center;padding-block:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main{width:100%;max-width:380px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:28px 24px}
.eyebrow{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);font-weight:700}
h1{font-size:22px;font-weight:600;margin:6px 0 4px}
p{color:var(--mut);font-size:13px;margin-bottom:18px}
label{display:block;font-size:12px;color:var(--mut);margin-bottom:6px}
input[type=password]{width:100%;font:inherit;color:var(--fg);background:transparent;border:1px solid var(--line);border-radius:10px;padding:11px 12px}
input[type=password]:focus-visible,button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.lembrar{display:flex;gap:8px;align-items:center;margin:12px 0 16px;font-size:13px;color:var(--mut)}
button{width:100%;font:inherit;font-weight:600;color:var(--btnfg);background:var(--btn);border:0;border-radius:10px;padding:11px 14px;cursor:pointer}
button[disabled]{opacity:.6;cursor:default}
#msg{min-height:20px;margin-top:12px;font-size:13px;color:var(--bad)}
iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:var(--bg)}
[hidden]{display:none!important}
</style>
</head>
<body data-estado="trancado">
<main id="cofre">
  <div class="eyebrow">Consórcio Chevrolet</div>
  <h1>Painel Gerencial</h1>
  <p>Acesso restrito. Digite a senha para abrir.</p>
  <form id="f" autocomplete="off">
    <label for="pw">Senha</label>
    <input id="pw" type="password" autocomplete="current-password" required>
    <div class="lembrar"><input id="lemb" type="checkbox"><label for="lemb" style="margin:0">Lembrar neste aparelho</label></div>
    <button id="ok" type="submit">Abrir painel</button>
    <div id="msg" role="status" aria-live="polite"></div>
  </form>
</main>
<script>
// O painel criptografado fica em painel.json e é buscado a cada abertura, sem usar cópia guardada (nem do navegador nem da rede),
// para sempre mostrar a última publicação. Esta página (index.html) quase nunca muda.
let P = null;
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const b64s = u => btoa(String.fromCharCode(...u));
const $ = s => document.querySelector(s);
async function carregar(){
  if(P) return P;
  const r = await fetch('painel.json?t=' + Date.now(), {cache: 'no-store'});
  if(!r.ok) throw new Error('painel');
  P = await r.json(); return P;
}
async function decifrar(bits){
  await carregar();
  const aes = await crypto.subtle.importKey('raw', bits.slice(0,32), 'AES-CBC', false, ['decrypt']);
  const mac = await crypto.subtle.importKey('raw', bits.slice(32,64), {name:'HMAC',hash:'SHA-256'}, false, ['verify']);
  const iv = b64(P.iv), ct = b64(P.ct), msg = new Uint8Array(iv.length+ct.length); msg.set(iv); msg.set(ct, iv.length);
  if(!await crypto.subtle.verify('HMAC', mac, b64(P.mac), msg)) throw new Error('senha');
  return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-CBC', iv}, aes, ct));
}
async function chaveDaSenha(pw){
  await carregar();
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits']);
  return new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2', hash:'SHA-256', salt:b64(P.salt), iterations:P.iter}, base, 512));
}
function mostrar(html){
  const f = document.createElement('iframe'); f.title = 'Painel Gerencial'; f.srcdoc = html;
  document.body.append(f); $('#cofre').hidden = true; document.body.dataset.estado = 'aberto'; document.title = 'Painel Concessionárias';
}
async function abrirComSenha(pw, lembrar){
  const bits = await chaveDaSenha(pw), html = await decifrar(bits);
  if(lembrar){ try{ localStorage.setItem('cofre_k', b64s(bits)); }catch(e){} }
  mostrar(html);
}
$('#f').addEventListener('submit', async e => {
  e.preventDefault(); const b = $('#ok'), m = $('#msg'); b.disabled = true; m.textContent = 'Abrindo...'; m.style.color = 'var(--mut)';
  try{ await abrirComSenha($('#pw').value, $('#lemb').checked); }
  catch(err){ document.body.dataset.estado = 'erro'; m.style.color = 'var(--bad)'; m.textContent = (err && err.message === 'senha') ? 'Senha incorreta.' : 'Não foi possível carregar o painel. Tente de novo.'; b.disabled = false; $('#pw').select(); }
});
(async () => { // aparelho que já abriu com "lembrar": tenta a chave guardada; se a senha mudou, volta ao pedido de senha
  try{ const k = localStorage.getItem('cofre_k'); if(k){ mostrar(await decifrar(b64(k))); return; } }
  catch(e){ if(e && e.message === 'senha'){ try{ localStorage.removeItem('cofre_k'); }catch(e2){} } }
  /*AUTO*/
})();
</script>
</body>
</html>
